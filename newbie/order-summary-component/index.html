<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
  <style>
    :root {
      --pale-blue: hsl(225, 100%, 94%);
      --bright-blue: hsl(245, 75%, 52%);
      --bright-blue-hover: hsl(245, 75%, 70%);
      --bright-blue-shadow: hsl(245, 75%, 90%);
      --very-pale-blue: hsl(225, 100%, 98%);
      --desaturated-blue: hsl(224, 23%, 55%);
      --dark-blue: hsl(223, 47%, 23%);
    }

    html,
    * {
      font-family: "Red Hat Display", sans-serif;
      font-size: 16px;
    }

    body {
      background-image: url('images/pattern-background-mobile.svg');
      background-position: top;
      background-repeat: no-repeat;
      background-size: contain;
    }

    @media only screen and (min-width: 376px) {
      body {
        background-image: url('images/pattern-background-desktop.svg');
      }
    }

    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="min-h-dvh bg-[var(--pale-blue)]">
  <main class="flex flex-col items-center justify-center gap-6 p-6 min-h-dvh">
    <section class="bg-white max-w-sm rounded-3xl overflow-hidden shadow-lg shadow-[var(--bright-blue-shadow)]"
      aria-labelledby="order-summary-title">
      <figure>
        <img src="images/illustration-hero.svg" alt="illustration" class="w-full">
      </figure>

      <article class="p-6 flex flex-col gap-6">
        <div class="text-center">
          <h1 id="order-summary-title" class="text-2xl font-bold text-[var(--dark-blue)] mb-4">Order Summary</h1>
          <p class="text-[var(--desaturated-blue)]">You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!</p>
        </div>

        <div class="flex gap-4 justify-between items-center bg-[var(--very-pale-blue)] p-4 rounded-xl" role="group"
          aria-labelledby="plan-title">
          <div class="flex gap-4">
            <div class="card__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
                <g fill="none" fill-rule="evenodd">
                  <circle cx="24" cy="24" r="24" fill="#DFE6FB" />
                  <path fill="#717FA6" fill-rule="nonzero"
                    d="M32.574 15.198a.81.81 0 00-.646-.19L20.581 16.63a.81.81 0 00-.696.803V26.934a3.232 3.232 0 00-1.632-.44A3.257 3.257 0 0015 29.747 3.257 3.257 0 0018.253 33a3.257 3.257 0 003.253-3.253v-8.37l9.726-1.39v5.327a3.232 3.232 0 00-1.631-.441 3.257 3.257 0 00-3.254 3.253 3.257 3.257 0 003.254 3.253 3.257 3.257 0 003.253-3.253V15.81a.81.81 0 00-.28-.613z" />
                </g>
              </svg>
            </div>
            <div>
              <h2 class="text-[var(--dark-blue)] font-bold" id="plan-title">Annual Plan</h2>
              <p class="text-[var(--desaturated-blue)]">$59.99/year</p>
            </div>
          </div>
          <div class="card__cta">
            <a href="#" class="underline text-[var(--bright-blue)] font-bold hover:opacity-50">Change</a>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <button
            class="py-3 px-8 font-medium bg-[var(--bright-blue)] text-white rounded-xl shadow-xl shadow-[var(--bright-blue-shadow)] hover:bg-[var(--bright-blue-hover)]"
            type="button">Proceed to
            Payment</button>
          <a class="py-3 px-8 font-bold text-[var(--desaturated-blue)] hover:text-[var(--dark-blue)]" href="#">Cancel
            Order</a>
        </div>
      </article>
    </section>

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        rel="noopener noreferrer">Frontend Mentor</a>.
      Coded by <a href="https://deepart.in">Deepart</a>.
    </div>
    <script src="https://cdn.tailwindcss.com"></script>
  </main>
</body>

</html>
